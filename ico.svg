<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b3e"/>
      <stop offset="1" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Ícono de tienda/carrito estilizado -->
  <g transform="translate(256,220)">
    <!-- Techo de tienda -->
    <path d="M-140,-70 L-140,-40 L140,-40 L140,-70 L100,-110 L-100,-110 Z"
          fill="#ffd54f" opacity="0.95"/>
    <!-- Cuerpo de tienda -->
    <rect x="-140" y="-40" width="280" height="140" rx="8" fill="#ffffff" opacity="0.95"/>
    <!-- Puerta -->
    <rect x="-30" y="20" width="60" height="80" rx="4" fill="#1a237e"/>
    <!-- Ventanas -->
    <rect x="-110" y="0" width="60" height="50" rx="4" fill="#1a237e" opacity="0.85"/>
    <rect x="50" y="0" width="60" height="50" rx="4" fill="#1a237e" opacity="0.85"/>
    <!-- Moneda con $ -->
    <circle cx="0" cy="140" r="60" fill="url(#coinGrad)" stroke="#0d1b3e" stroke-width="4"/>
    <text x="0" y="165" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900"
          fill="#0d1b3e" text-anchor="middle">$</text>
  </g>

  <!-- Texto POS Pro -->
  <text x="256" y="455" font-family="Arial, Helvetica, sans-serif" font-size="72"
        font-weight="900" fill="#ffd54f" text-anchor="middle" letter-spacing="4">POS PRO</text>
</svg>
